services:
  web:
    environment:
      STORAGE_BACKEND: s3
      S3_BUCKET: cloudbox
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    depends_on:
      bucket:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 2; done; mc mb --ignore-existing local/cloudbox"

volumes:
  minio-data:
